<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>早餐店菜單</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="header">
            <h1>🍳 早餐店菜單</h1>
            <p>達利早餐 · 麥味登 · Q Burger · 卯時早午餐</p>
        </header>

        <div class="store-tabs-wrapper">
            <nav class="store-tabs" id="storeTabs"></nav>
        </div>

        <section class="store-info" id="storeInfo"></section>

        <div class="search-bar-wrapper">
            <div class="search-bar">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="搜尋餐點名稱..."
                    autocomplete="off"
                />
                <button
                    class="search-clear"
                    id="searchClear"
                    onclick="clearSearch()"
                >
                    ✕
                </button>
            </div>
        </div>

        <div class="filter-row">
            <nav class="category-filter" id="categoryFilter"></nav>
            <div class="price-filter" id="priceFilter"></div>
        </div>

        <main class="menu-container">
            <div id="searchResultInfo"></div>
            <div id="menuContent"></div>
        </main>

        <footer class="footer">
            <p>菜單價格僅供參考，實際以店家公告為準</p>
            <p style="margin-top: 0.5rem">
                <a href="https://dailybreakfast.com.tw" target="_blank"
                    >達利早餐官網</a
                >
                ·
                <a href="https://www.qburger.com.tw" target="_blank"
                    >Q Burger官網</a
                >
            </p>
        </footer>

        <script src="data.js"></script>
        <script>
            // ============================================
            // 程式邏輯
            // ============================================
            let currentStore = stores[0];
            let currentCategory = "all";
            let currentPriceFilter = "all";
            let popularOnly = false;
            let searchQuery = "";

            const PRICE_FILTERS = [
                { id: "all", label: "所有價位" },
                { id: "under50", label: "$50 以下", fn: (p) => p <= 50 },
                {
                    id: "50to100",
                    label: "$51–100",
                    fn: (p) => p > 50 && p <= 100,
                },
                { id: "over100", label: "$100 以上", fn: (p) => p > 100 },
            ];

            function init() {
                renderStoreTabs();
                renderStoreInfo();
                renderCategoryFilter();
                renderPriceFilter();
                renderMenu();

                const input = document.getElementById("searchInput");
                input.addEventListener("input", () => {
                    searchQuery = input.value.trim();
                    document
                        .getElementById("searchClear")
                        .classList.toggle("visible", searchQuery.length > 0);
                    renderMenu();
                });
            }

            function clearSearch() {
                searchQuery = "";
                document.getElementById("searchInput").value = "";
                document
                    .getElementById("searchClear")
                    .classList.remove("visible");
                renderMenu();
            }

            function renderStoreTabs() {
                const container = document.getElementById("storeTabs");
                container.innerHTML = stores
                    .map(
                        (store) => `
                <button class="store-tab ${store.id === currentStore.id ? "active" : ""}"
                        data-store="${store.id}"
                        onclick="switchStore('${store.id}')">
                    ${store.name}
                </button>
            `,
                    )
                    .join("");
            }

            function renderStoreInfo() {
                const container = document.getElementById("storeInfo");
                container.innerHTML = `
                <h2>
                    ${currentStore.name}
                    <span class="store-badge ${currentStore.id}">${currentStore.badge}</span>
                </h2>
                <div class="store-meta">
                    <span>📍 ${currentStore.address}</span>
                    <span>🕐 ${currentStore.hours}</span>
                    ${currentStore.phone ? `<span>📞 ${currentStore.phone}</span>` : ""}
                </div>
            `;
                container.classList.add("fade-in");
            }

            function renderCategoryFilter() {
                const categories = Object.keys(currentStore.menu);
                const container = document.getElementById("categoryFilter");
                container.innerHTML = `
                <button class="category-btn ${currentCategory === "all" ? "active" : ""}"
                        onclick="filterCategory('all')">全部</button>
                ${categories
                    .map(
                        (cat) => `
                    <button class="category-btn ${currentCategory === cat ? "active" : ""}"
                            onclick="filterCategory('${cat}')">
                        ${cat.replace(/^[^\s]+\s/, "")}
                    </button>
                `,
                    )
                    .join("")}
                <button class="category-btn popular-btn ${popularOnly ? "active" : ""}"
                        onclick="togglePopular()">🔥 人氣</button>
            `;
            }

            function renderPriceFilter() {
                const container = document.getElementById("priceFilter");
                container.innerHTML = PRICE_FILTERS.map(
                    (f) => `
                <button class="category-btn ${currentPriceFilter === f.id ? "active" : ""}"
                        onclick="filterPrice('${f.id}')">${f.label}</button>
            `,
                ).join("");
            }

            function highlightText(text, query) {
                if (!query) return text;
                const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                return text.replace(
                    new RegExp(escaped, "gi"),
                    (m) => `<span class="highlight">${m}</span>`,
                );
            }

            function getFilteredItems(items, skipNameFilter = false) {
                let result = items;
                if (popularOnly) result = result.filter((i) => i.popular);
                const priceRule = PRICE_FILTERS.find(
                    (f) => f.id === currentPriceFilter,
                );
                if (priceRule && priceRule.fn)
                    result = result.filter((i) => priceRule.fn(i.price));
                if (searchQuery && !skipNameFilter) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter((i) =>
                        i.name.toLowerCase().includes(q),
                    );
                }
                return result;
            }

            function renderMenu() {
                const container = document.getElementById("menuContent");
                const infoEl = document.getElementById("searchResultInfo");
                let html = "";
                let totalShown = 0;

                const categories =
                    currentCategory === "all"
                        ? Object.keys(currentStore.menu)
                        : [currentCategory];

                const isFiltering =
                    searchQuery || popularOnly || currentPriceFilter !== "all";

                categories.forEach((category) => {
                    const categoryMatches = searchQuery &&
                        category.toLowerCase().includes(searchQuery.toLowerCase());
                    // 分類標題符合時，顯示該分類所有品項（仍套用人氣/價格篩選）
                    const items = categoryMatches
                        ? getFilteredItems(currentStore.menu[category], true)
                        : getFilteredItems(currentStore.menu[category]);
                    if (isFiltering && items.length === 0) return;

                    html += `<div class="section-title">${highlightText(category, searchQuery)}</div>`;
                    html += '<div class="menu-list">';
                    items.forEach((item) => {
                        totalShown++;
                        html += `
                        <div class="menu-item fade-in ${item.popular ? "popular" : ""}">
                            <div class="menu-item-info">
                                <div class="menu-item-name">${categoryMatches ? item.name : highlightText(item.name, searchQuery)}</div>
                                ${item.desc ? `<div class="menu-item-desc">${item.desc}</div>` : ""}
                            </div>
                            <div class="menu-item-price ${currentStore.id}">$${item.price}</div>
                        </div>
                    `;
                    });
                    html += "</div>";
                });

                if (isFiltering && totalShown === 0) {
                    html = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>找不到符合條件的餐點</p>
                    </div>
                `;
                    infoEl.innerHTML = "";
                } else if (isFiltering) {
                    infoEl.innerHTML = `<div class="search-result-info">找到 ${totalShown} 項餐點</div>`;
                } else {
                    infoEl.innerHTML = "";
                }

                container.innerHTML = html;
            }

            function switchStore(storeId) {
                currentStore = stores.find((s) => s.id === storeId);
                currentCategory = "all";
                currentPriceFilter = "all";
                popularOnly = false;
                clearSearch();
                renderStoreTabs();
                renderStoreInfo();
                renderCategoryFilter();
                renderPriceFilter();
                renderMenu();
            }

            function filterCategory(category) {
                currentCategory = category;
                renderCategoryFilter();
                renderMenu();
            }

            function filterPrice(filterId) {
                currentPriceFilter = filterId;
                renderPriceFilter();
                renderMenu();
            }

            function togglePopular() {
                popularOnly = !popularOnly;
                renderCategoryFilter();
                renderMenu();
            }

            init();
        </script>
    </body>
</html>
