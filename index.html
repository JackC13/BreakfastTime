<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>早餐店菜單</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="header">
            <h1>🍳 早餐店菜單</h1>
            <p>達利早餐 · 麥味登 · Q Burger · 卯時早午餐</p>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切換深色模式"></button>
        </header>

        <div class="sticky-header">
            <div class="store-tabs-wrapper">
                <nav class="store-tabs" id="storeTabs"></nav>
            </div>

            <div class="search-bar-wrapper">
                <div class="search-bar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜尋餐點名稱..." autocomplete="off" />
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
                </div>
            </div>

            <div class="filter-row">
                <nav class="category-filter" id="categoryFilter"></nav>
            </div>
        </div>

        <section class="store-info" id="storeInfo"></section>

        <main class="menu-container">
            <div id="searchResultInfo"></div>
            <div id="menuContent"></div>
        </main>

        <footer class="footer">
            <p>菜單價格僅供參考，實際以店家公告為準</p>
            <p style="margin-top: 0.5rem">
                <a href="https://dailybreakfast.com.tw" target="_blank">達利早餐官網</a>
                ·
                <a href="https://www.qburger.com.tw" target="_blank">Q Burger官網</a>
            </p>
        </footer>

        <!-- 捲回頂部 -->
        <button class="scroll-top-btn" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

        <!-- 訂單 FAB -->
        <button class="order-fab" id="orderFab" onclick="openOrder()" style="display:none">
            🛒 <span class="order-fab-count" id="orderFabCount">0</span>
        </button>

        <!-- 訂單面板 -->
        <div class="order-overlay" id="orderOverlay" onclick="closeOrder()"></div>
        <aside class="order-sheet" id="orderSheet">
            <div class="order-sheet-handle"></div>
            <div class="order-sheet-header">
                <h3>我的選單</h3>
                <button class="order-clear-btn" onclick="clearAllOrders()">清除全部</button>
            </div>
            <div class="order-sheet-body" id="orderBody"></div>
            <div class="order-sheet-footer">
                <button class="line-share-btn" onclick="shareToLine()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.105.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                    </svg>
                    分享到 LINE
                </button>
            </div>
        </aside>

        <script src="data.js"></script>
        <script>
            // ── 深色模式 ──────────────────────────────
            (function () {
                const saved = localStorage.getItem("theme");
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                const isDark = saved === "dark" || (!saved && prefersDark);
                if (isDark) document.documentElement.setAttribute("data-theme", "dark");
                updateToggleIcon(isDark);

                function updateToggleIcon(dark) {
                    const btn = document.getElementById("themeToggle");
                    if (btn) btn.textContent = dark ? "☀️" : "🌙";
                }

                window.toggleTheme = function () {
                    const current = document.documentElement.getAttribute("data-theme");
                    const next = current === "dark" ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", next);
                    localStorage.setItem("theme", next);
                    updateToggleIcon(next === "dark");
                };
            })();
        </script>
        <script>
            // ============================================
            // 程式邏輯
            // ============================================
            let currentStore = stores[0];
            let currentCategory = "all";
            let popularOnly = false;
            let searchQuery = "";

            // orders: { [storeId::itemName]: { storeId, storeName, name, price, qty } }
            const orders = {};

            // ── 工具 ──────────────────────────────────
            function escJS(str) {
                return str.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
            }

            function itemKey(storeId, name) {
                return `${storeId}::${name}`;
            }

            function getQty(storeId, name) {
                return orders[itemKey(storeId, name)]?.qty || 0;
            }

            // ── 點選餐點 ──────────────────────────────
            function toggleItem(storeId, name, price) {
                const key = itemKey(storeId, name);
                if (orders[key]) {
                    delete orders[key];
                } else {
                    const store = stores.find((s) => s.id === storeId);
                    orders[key] = { storeId, storeName: store.name, name, price, qty: 1 };
                }
                updateMenuItemState(storeId, name);
                updateFab();
                if (document.getElementById("orderSheet").classList.contains("open")) {
                    renderOrderBody();
                }
            }

            function updateMenuItemState(storeId, name) {
                const selected = getQty(storeId, name) > 0;
                const key = itemKey(storeId, name);
                document.querySelectorAll(`.menu-item[data-key="${CSS.escape(key)}"]`)
                    .forEach((el) => el.classList.toggle("selected", selected));
            }

            // ── 訂單面板內的數量調整 ──────────────────
            function renderQtyBtns(storeId, name, price, qty) {
                const s = escJS(storeId), n = escJS(name);
                return `<button class="qty-btn" onclick="changeQty('${s}','${n}',${price},-1)">－</button>`
                     + `<span class="qty-num">${qty}</span>`
                     + `<button class="qty-btn qty-add" onclick="changeQty('${s}','${n}',${price},1)">＋</button>`;
            }

            function changeQty(storeId, name, price, delta) {
                const key = itemKey(storeId, name);
                if (!orders[key]) return;
                orders[key].qty = Math.max(0, orders[key].qty + delta);
                if (orders[key].qty === 0) delete orders[key];
                updateMenuItemState(storeId, name);
                updateFab();
                if (document.getElementById("orderSheet").classList.contains("open")) {
                    renderOrderBody();
                }
            }

            function updateFab() {
                const total = Object.values(orders).reduce((s, o) => s + o.qty, 0);
                const fab = document.getElementById("orderFab");
                fab.style.display = total > 0 ? "flex" : "none";
                document.getElementById("orderFabCount").textContent = total;
                const shareBtn = document.querySelector(".line-share-btn");
                if (shareBtn) shareBtn.disabled = total === 0;
            }

            // ── 訂單面板 ──────────────────────────────
            function openOrder() {
                renderOrderBody();
                document.getElementById("orderOverlay").classList.add("open");
                document.getElementById("orderSheet").classList.add("open");
            }

            function closeOrder() {
                document.getElementById("orderOverlay").classList.remove("open");
                document.getElementById("orderSheet").classList.remove("open");
            }

            let _clearTimer = null;
            let _clearConfirming = false;

            function clearAllOrders() {
                const btn = document.querySelector(".order-clear-btn");
                if (!_clearConfirming) {
                    _clearConfirming = true;
                    btn.textContent = "確定清除？";
                    btn.classList.add("confirming");
                    _clearTimer = setTimeout(() => {
                        _clearConfirming = false;
                        btn.textContent = "清除全部";
                        btn.classList.remove("confirming");
                    }, 2500);
                    return;
                }
                clearTimeout(_clearTimer);
                _clearConfirming = false;
                Object.keys(orders).forEach((k) => delete orders[k]);
                document.querySelectorAll(".menu-item.selected")
                    .forEach((el) => el.classList.remove("selected"));
                updateFab();
                renderOrderBody();
            }

            function updateNote(storeId, name, value) {
                const key = itemKey(storeId, name);
                if (orders[key]) orders[key].note = value;
            }

            function shareToLine() {
                const entries = Object.values(orders).filter((o) => o.qty > 0);
                if (entries.length === 0) return;

                const storeOrder = stores.map((s) => s.id);
                const byStore = {};
                entries.forEach((e) => {
                    if (!byStore[e.storeId]) byStore[e.storeId] = { name: e.storeName, items: [] };
                    byStore[e.storeId].items.push(e);
                });

                let text = "🍳 早餐選單\n";
                let grand = 0;
                storeOrder.filter((id) => byStore[id]).forEach((id) => {
                    const { name, items } = byStore[id];
                    text += `\n【${name}】\n`;
                    items.forEach((i) => {
                        const sub = i.price * i.qty;
                        grand += sub;
                        text += `・${i.name}`;
                        if (i.qty > 1) text += ` x${i.qty}`;
                        text += `  $${sub}`;
                        if (i.note) text += `（${i.note}）`;
                        text += "\n";
                    });
                });
                text += `\n合計 $${grand}`;

                window.open("https://line.me/R/share?text=" + encodeURIComponent(text), "_blank");
            }

            function renderOrderBody() {
                const entries = Object.values(orders).filter((o) => o.qty > 0);
                const body = document.getElementById("orderBody");

                if (entries.length === 0) {
                    body.innerHTML = '<p class="order-empty">尚未選擇任何餐點</p>';
                    return;
                }

                // 依店家順序分組
                const storeOrder = stores.map((s) => s.id);
                const byStore = {};
                entries.forEach((e) => {
                    if (!byStore[e.storeId]) byStore[e.storeId] = { name: e.storeName, items: [] };
                    byStore[e.storeId].items.push(e);
                });

                let html = "";
                let grand = 0;

                storeOrder.filter((id) => byStore[id]).forEach((id) => {
                    const { name, items } = byStore[id];
                    const sub = items.reduce((s, i) => s + i.price * i.qty, 0);
                    grand += sub;
                    html += `
                        <div class="order-section">
                            <div class="order-section-header">
                                <span class="store-badge ${id}">${name}</span>
                                <span class="order-sub">$${sub}</span>
                            </div>
                            ${items.map((i) => `
                            <div class="order-row">
                                <div class="order-row-left">
                                    <span class="order-row-name">${i.name}</span>
                                    <input class="order-note-input"
                                           placeholder="備註（如：不要蔥）"
                                           value="${(i.note || "").replace(/"/g, "&quot;")}"
                                           oninput="updateNote('${escJS(i.storeId)}','${escJS(i.name)}',this.value)">
                                </div>
                                <div class="order-row-right">
                                    <div class="qty-control order-qty">
                                        ${renderQtyBtns(i.storeId, i.name, i.price, i.qty)}
                                    </div>
                                    <span class="order-row-price">$${i.price * i.qty}</span>
                                </div>
                            </div>`).join("")}
                        </div>`;
                });

                html += `<div class="order-grand">合計 <strong>$${grand}</strong></div>`;
                body.innerHTML = html;
            }

            // ── 初始化 ────────────────────────────────
            function init() {
                renderStoreTabs();
                renderStoreInfo();
                renderCategoryFilter();
                renderMenu();

                const input = document.getElementById("searchInput");
                window.addEventListener("scroll", () => {
                    document.getElementById("scrollTopBtn")
                        .classList.toggle("visible", window.scrollY > 300);
                });

                input.addEventListener("input", () => {
                    searchQuery = input.value.trim();
                    document.getElementById("searchClear").classList.toggle("visible", searchQuery.length > 0);
                    renderMenu();
                });
            }

            function clearSearch() {
                searchQuery = "";
                document.getElementById("searchInput").value = "";
                document.getElementById("searchClear").classList.remove("visible");
                renderMenu();
            }

            function renderStoreTabs() {
                const container = document.getElementById("storeTabs");
                container.innerHTML = stores.map((store) => `
                    <button class="store-tab ${store.id === currentStore.id ? "active" : ""}"
                            data-store="${store.id}" onclick="switchStore('${store.id}')">
                        ${store.name}
                    </button>`).join("");
            }

            function renderStoreInfo() {
                const container = document.getElementById("storeInfo");
                container.innerHTML = `
                    <h2>
                        ${currentStore.name}
                        <span class="store-badge ${currentStore.id}">${currentStore.badge}</span>
                    </h2>
                    <div class="store-meta">
                        <span>📍 ${currentStore.address}</span>
                        <span>🕐 ${currentStore.hours}</span>
                        ${currentStore.phone ? `<span>📞 ${currentStore.phone}</span>` : ""}
                    </div>`;
                container.classList.add("fade-in");
            }

            function renderCategoryFilter() {
                const categories = Object.keys(currentStore.menu);
                const container = document.getElementById("categoryFilter");
                container.innerHTML = `
                    <button class="category-btn ${currentCategory === "all" ? "active" : ""}"
                            onclick="filterCategory('all')">全部</button>
                    ${categories.map((cat) => `
                        <button class="category-btn ${currentCategory === cat ? "active" : ""}"
                                onclick="filterCategory('${escJS(cat)}')">
                            ${cat.replace(/^[^\s]+\s/, "")}
                        </button>`).join("")}
                    <button class="category-btn popular-btn ${popularOnly ? "active" : ""}"
                            onclick="togglePopular()">🔥 人氣</button>`;
            }

            function highlightText(text, query) {
                if (!query) return text;
                const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                return text.replace(new RegExp(escaped, "gi"), (m) => `<span class="highlight">${m}</span>`);
            }

            function getFilteredItems(items, skipNameFilter = false) {
                let result = items;
                if (popularOnly) result = result.filter((i) => i.popular);
                if (searchQuery && !skipNameFilter) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter((i) => i.name.toLowerCase().includes(q));
                }
                return result;
            }

            function renderMenu() {
                const container = document.getElementById("menuContent");
                const infoEl = document.getElementById("searchResultInfo");
                let html = "";
                let totalShown = 0;

                const categories = currentCategory === "all"
                    ? Object.keys(currentStore.menu)
                    : [currentCategory];

                const isFiltering = searchQuery || popularOnly;

                categories.forEach((category) => {
                    const categoryMatches = searchQuery &&
                        category.toLowerCase().includes(searchQuery.toLowerCase());
                    const items = categoryMatches
                        ? getFilteredItems(currentStore.menu[category], true)
                        : getFilteredItems(currentStore.menu[category]);
                    if (isFiltering && items.length === 0) return;

                    html += `<div class="section-title">${highlightText(category, searchQuery)}</div>`;
                    html += '<div class="menu-list">';
                    items.forEach((item) => {
                        totalShown++;
                        const qty = getQty(currentStore.id, item.name);
                        const key = itemKey(currentStore.id, item.name);
                        const sid = escJS(currentStore.id), n = escJS(item.name);
                        html += `
                            <div class="menu-item fade-in store-${currentStore.id} ${item.popular ? "popular" : ""} ${qty > 0 ? "selected" : ""}"
                                 data-key="${key}"
                                 onclick="toggleItem('${sid}','${n}',${item.price})">
                                <div class="menu-item-info">
                                    <div class="menu-item-name">${categoryMatches ? item.name : highlightText(item.name, searchQuery)}</div>
                                    ${item.desc ? `<div class="menu-item-desc">${item.desc}</div>` : ""}
                                </div>
                                <div class="menu-item-price ${currentStore.id}">$${item.price}</div>
                            </div>`;
                    });
                    html += "</div>";
                });

                if (isFiltering && totalShown === 0) {
                    html = `<div class="empty-state"><div class="empty-icon">🔍</div><p>找不到符合條件的餐點</p></div>`;
                    infoEl.innerHTML = "";
                } else if (isFiltering) {
                    infoEl.innerHTML = `<div class="search-result-info">找到 ${totalShown} 項餐點</div>`;
                } else {
                    infoEl.innerHTML = "";
                }

                container.innerHTML = html;
            }

            function switchStore(storeId) {
                currentStore = stores.find((s) => s.id === storeId);
                currentCategory = "all";
                popularOnly = false;
                clearSearch();
                renderStoreTabs();
                renderStoreInfo();
                renderCategoryFilter();
                renderMenu();
            }

            function filterCategory(category) {
                currentCategory = category;
                renderCategoryFilter();
                renderMenu();
            }

            function togglePopular() {
                popularOnly = !popularOnly;
                renderCategoryFilter();
                renderMenu();
            }

            init();
        </script>
    </body>
</html>
